<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Migration Assurance | Painel de Controle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i data-lucide="cloud-cog" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight">Cloud Migration Assurance</h1>
                    <p class="text-xs text-slate-400">Gestão e Monitorização de Workloads</p>
                </div>
            </div>

            <!-- Indicador de Status da API -->
            <div id="api-status" class="flex items-center space-x-2 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800 text-xs">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse" id="status-dot"></span>
                <span id="status-text" class="text-slate-300 font-medium">A verificar API...</span>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Coluna Esquerda: Formulário de Cadastro -->
        <section class="bg-slate-950 border border-slate-800 rounded-xl p-6 shadow-xl h-fit">
            <div class="flex items-center space-x-2 mb-6">
                <i data-lucide="plus-circle" class="w-5 h-5 text-blue-500"></i>
                <h2 class="text-lg font-semibold text-slate-200">Novo Workload</h2>
            </div>

            <form id="workloadForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
                        Nome do Workload
                    </label>
                    <input type="text"
                           id="name"
                           required
                           placeholder="Ex: API-Financeiro-Prod"
                           class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500 transition-colors">
                </div>

                <!-- Campo Target URL -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
                        URL Alvo (Target URL)
                    </label>
                    <input type="url"
                           id="targetUrl"
                           required
                           placeholder="https://api.exemplo.com/health"
                           class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500 transition-colors">
                </div>

                <!-- CAMPO ADICIONADO: Ambiente -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
                        Ambiente
                    </label>
                    <select id="environment"
                            required
                            class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500 transition-colors">
                        <option value="Production">Produção (Production)</option>
                        <option value="Staging">Homologação (Staging)</option>
                        <option value="Development">Desenvolvimento (Development)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
                        Descrição
                    </label>
                    <textarea id="description"
                              rows="3"
                              required
                              placeholder="Descreva os detalhes da migração..."
                              class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500 transition-colors resize-none"></textarea>
                </div>

                <button type="submit"
                        id="btn-submit"
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-all flex items-center justify-center space-x-2 shadow-lg shadow-blue-600/20">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    <span>Registar Workload</span>
                </button>
            </form>
        </section>

        <!-- Coluna Direita: Listagem e Métricas -->
        <section class="lg:col-span-2 space-y-6">

            <!-- Cards de Métricas -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-5 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">
                            Total Registado
                        </p>
                        <h3 id="metric-total" class="text-3xl font-bold text-slate-100 mt-1">0</h3>
                    </div>

                    <div class="bg-blue-500/10 text-blue-400 p-3 rounded-lg border border-blue-500/20">
                        <i data-lucide="server" class="w-6 h-6"></i>
                    </div>
                </div>

                <div class="bg-slate-950 border border-slate-800 rounded-xl p-5 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">
                            Arquitetura
                        </p>
                        <h3 class="text-lg font-bold text-slate-100 mt-1">Clean + CQRS</h3>
                    </div>

                    <div class="bg-emerald-500/10 text-emerald-400 p-3 rounded-lg border border-emerald-500/20">
                        <i data-lucide="layers" class="w-6 h-6"></i>
                    </div>
                </div>
            </div>

            <!-- Painel da Tabela -->
            <div class="bg-slate-950 border border-slate-800 rounded-xl shadow-xl overflow-hidden">
                <div class="p-5 border-b border-slate-800 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="database" class="w-5 h-5 text-blue-500"></i>
                        <h2 class="text-lg font-semibold text-slate-200">Workloads Ativos</h2>
                    </div>

                    <div class="flex items-center space-x-3">
                        <!-- Busca Instantânea -->
                        <div class="relative">
                            <i data-lucide="search" class="w-4 h-4 text-slate-500 absolute left-3 top-3"></i>

                            <input type="text"
                                   id="search-input"
                                   placeholder="Filtrar workloads..."
                                   oninput="filterWorkloads()"
                                   class="bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-4 py-2 text-xs text-slate-100 focus:outline-none focus:border-blue-500 w-48 sm:w-64 transition-colors">
                        </div>

                        <button onclick="loadWorkloads()"
                                class="bg-slate-900 hover:bg-slate-800 text-slate-300 p-2 rounded-lg border border-slate-800 transition-colors"
                                title="Atualizar dados">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-800 text-xs font-semibold uppercase tracking-wider text-slate-400 bg-slate-900/40">
                                <th class="p-4">Nome & URL</th>
                                <th class="p-4">Descrição</th>
                                <th class="p-4">Status</th>
                                <th class="p-4">Ações</th>
                            </tr>
                        </thead>

                        <tbody id="workloadTableBody" class="divide-y divide-slate-800/60 text-sm text-slate-300">
                            <!-- Injetado dinamicamente via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <!-- Script de Integração e Comportamentos -->
    <script>
                lucide.createIcons();

                // URL DA API
                const API_URL = 'https://localhost:7066/api/workloads';

                let allWorkloads = [];

                async function checkApiHealth() {
                    const dot = document.getElementById('status-dot');
                    const text = document.getElementById('status-text');

                    try {
                        const res = await fetch(API_URL);

                        if (res.ok) {
                            dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
                            text.innerText = "API Online";
                        } else {
                            throw new Error();
                        }

                    } catch {
                        dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                        text.innerText = "API Offline / Erro";
                    }
                }

                async function loadWorkloads() {
                    checkApiHealth();

                    const tbody = document.getElementById('workloadTableBody');

                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="p-8 text-center text-slate-500">
                                A carregar dados da API...
                            </td>
                        </tr>
                    `;

                    try {
                        const response = await fetch(API_URL);

                        if (!response.ok) {
                            throw new Error('Falha ao comunicar com o servidor');
                        }

                        allWorkloads = await response.json();
                        document.getElementById('metric-total').innerText = allWorkloads.length;

                        renderTable(allWorkloads);

                    } catch (error) {
                        console.error(error);
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="4" class="p-8 text-center text-rose-400">
                                    Não foi possível conectar ao backend na porta 7066.
                                </td>
                            </tr>
                        `;
                    }
                }

                // Função auxiliar para renderizar a badge de status
                function getStatusBadge(status) {
                    const s = String(status).toLowerCase();
                    if (s === '2' || s === 'passed') return '<span class="px-2 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-md text-xs font-semibold">Passed</span>';
                    if (s === '3' || s === 'failed') return '<span class="px-2 py-1 bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-md text-xs font-semibold">Failed</span>';
                    if (s === '1' || s === 'inprogress') return '<span class="px-2 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-md text-xs font-semibold">Em Curso</span>';
                    return '<span class="px-2 py-1 bg-slate-700 text-slate-300 border border-slate-600 rounded-md text-xs font-semibold">Pendente</span>';
                }

                function renderTable(data) {
                    const tbody = document.getElementById('workloadTableBody');
                    tbody.innerHTML = '';

                    if (data.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="4" class="p-8 text-center text-slate-500">
                                    Nenhum workload encontrado.
                                </td>
                            </tr>
                        `;
                        return;
                    }

                    data.forEach(item => {
                        const row = document.createElement('tr');
                        row.className = "hover:bg-slate-900/50 transition-colors";

                        row.innerHTML = `
                            <td class="p-4">
                                <div class="font-medium text-slate-200">${item.name}</div>
                                <div class="text-xs text-blue-400 mt-1 truncate max-w-[200px]" title="${item.targetUrl || 'Sem URL'}">
                                    ${item.targetUrl || 'N/A'}
                                </div>
                            </td>
                            <td class="p-4 text-slate-400 text-xs">${item.description}</td>
                            <td class="p-4">${getStatusBadge(item.status)}</td>
                            <td class="p-4">
                                <button onclick="verifyWorkload('${item.id}', this)"
                                        class="flex items-center space-x-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded transition-colors shadow-sm">
                                    <i data-lucide="play" class="w-3 h-3 text-emerald-400"></i>
                                    <span>Testar</span>
                                </button>
                            </td>
                        `;

                        tbody.appendChild(row);
                    });

                    lucide.createIcons();
                }

                function filterWorkloads() {
                    const term = document.getElementById('search-input').value.toLowerCase();
                    const filtered = allWorkloads.filter(w =>
                        w.name.toLowerCase().includes(term) ||
                        w.description.toLowerCase().includes(term)
                    );
                    renderTable(filtered);
                }

                // Chamar o endpoint /verify
                async function verifyWorkload(id, btnElement) {
                    const originalHtml = btnElement.innerHTML;
                    btnElement.disabled = true;
                    btnElement.innerHTML = `<i data-lucide="loader-2" class="w-3 h-3 animate-spin text-blue-400"></i><span>A testar...</span>`;
                    lucide.createIcons();

                    try {
                        const response = await fetch(`${API_URL}/${id}/verify`, { method: 'POST' });

                        if (response.ok) {
                            await loadWorkloads();
                        } else {
                            alert('Erro ao tentar verificar o workload.');
                            btnElement.innerHTML = originalHtml;
                            btnElement.disabled = false;
                        }
                    } catch (error) {
                        console.error(error);
                        alert('Erro de rede ao verificar.');
                        btnElement.innerHTML = originalHtml;
                        btnElement.disabled = false;
                    }
                }

                document.getElementById('workloadForm').addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const name = document.getElementById('name').value;
                    const targetUrl = document.getElementById('targetUrl').value;
                    const environment = document.getElementById('environment').value;
                    const description = document.getElementById('description').value;
                    const btn = document.getElementById('btn-submit');

                    btn.disabled = true;
                    btn.innerHTML = `
                        <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                        <span>A guardar...</span>
                    `;
                    lucide.createIcons();

                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name,
                                description,
                                environment,
                                targetUrl
                            })
                        });

                        if (response.ok) {
                            document.getElementById('workloadForm').reset();
                            loadWorkloads();
                        } else {
                            alert('Erro ao processar o registo.');
                        }

                    } catch (error) {
                        console.error(error);
                        alert('Erro de conexão ao enviar o comando.');

                    } finally {
                        btn.disabled = false;
                        btn.innerHTML = `
                            <i data-lucide="save" class="w-4 h-4"></i>
                            <span>Registar Workload</span>
                        `;
                        lucide.createIcons();
                    }
                });

                // Inicializa a listagem ao abrir a página
                loadWorkloads();
    </script>
</body>
</html>
